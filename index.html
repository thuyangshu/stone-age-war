<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6B4530">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>石器大战</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game"></div>

<!-- 主菜单 -->
<div id="title" class="screen">
  <div class="titlebox">
    <h1>石器大战</h1>
    <p class="sub">两个原始人 · 一条抛物线 · 血先空者输</p>
    <div class="menu">
      <button id="btn-solo" class="big">人机对战</button>
      <button id="btn-duo" class="big ghost">本地双人</button>
    </div>
    <div id="diff">
      <button class="lv" data-lv="easy">轻松</button>
      <button class="lv on" data-lv="medium">普通</button>
      <button class="lv" data-lv="hard">硬核</button>
    </div>
    <p class="tip">按住画面往<b>反方向</b>拖拽瞄准，拖得越远出手越重</p>
  </div>
</div>

<!-- 顶栏 -->
<div id="hud" hidden>
  <div class="pcard" id="p0card">
    <div class="prow"><span class="pname">玩家一</span><span class="burn" hidden>🔥</span></div>
    <div class="hpbar"><div class="hpfill"></div></div>
  </div>
  <div class="mid">
    <div id="turnlabel">玩家一</div>
    <div id="turnsub">选择武器</div>
    <div class="btns">
      <button id="btn-mute" class="icon-btn" aria-label="静音">🔊</button>
      <button id="btn-pause" class="icon-btn" aria-label="暂停">⏸</button>
    </div>
  </div>
  <div class="pcard right" id="p1card">
    <div class="prow"><span class="burn" hidden>🔥</span><span class="pname">玩家二</span></div>
    <div class="hpbar"><div class="hpfill"></div></div>
  </div>
</div>

<!-- 底栏：武器 -->
<div id="weapons" hidden></div>

<!-- 力度条 -->
<div id="power" hidden>
  <div class="pw-track"><div class="pw-fill"></div><span class="pw-num">0%</span></div>
  <div class="pw-hint">松手投掷</div>
</div>

<!-- 回合横幅 -->
<div id="banner" hidden></div>

<!-- 双人交接遮罩 -->
<div id="handoff" class="screen mask" hidden>
  <div class="titlebox">
    <h2 id="handoff-who">轮到玩家二</h2>
    <p class="sub">把设备递过去</p>
    <button id="btn-handoff" class="big">我准备好了</button>
  </div>
</div>

<!-- 暂停 -->
<div id="pause" class="screen mask" hidden>
  <div class="titlebox">
    <h2>暂停</h2>
    <div class="menu">
      <button id="btn-resume" class="big">继续</button>
      <button id="btn-restart" class="big ghost">重开一局</button>
      <button id="btn-quit" class="big ghost">回到主菜单</button>
    </div>
  </div>
</div>

<!-- 结算 -->
<div id="over" class="screen mask" hidden>
  <div class="titlebox">
    <h2 id="over-title">玩家一 获胜</h2>
    <p class="sub" id="over-sub"></p>
    <div class="menu">
      <button id="btn-again" class="big">再来一局</button>
      <button id="btn-home" class="big ghost">回到主菜单</button>
    </div>
  </div>
</div>

<div id="rotate" hidden>把手机横过来更好瞄准</div>
<!-- 对手跑到屏幕外时贴在画面边缘的方向标（手机竖屏的常态） -->
<div id="foe" hidden></div>

<script src="vendor/phaser.min.js"></script>
<script src="vendor/zzfx.global.js"></script>
<script src="js/data.js"></script>
<!-- world 必须在 logic 之前：logic 的双环境守卫会在加载时同步取 WORLD，
     顺序反了它就拿不到（`typeof WORLD === 'undefined'` → 去调浏览器里不存在的 require） -->
<script src="js/world.js"></script>
<script src="js/logic.js"></script>
<script src="js/sfx.js"></script>
<script src="js/textures.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
